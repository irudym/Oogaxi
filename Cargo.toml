[package]
name = "oogaxi"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["experements/water"]

[lib]
name = "oogaxi"
path = "src/lib.rs"

[[bin]]
name = "oogaxi"
path = "src/main.rs"

[workspace.dependencies]
bevy = { version = "0.19.0", features = ["dev"] }
bevy_common_assets = { version = "0.17", features = ["json"] }
bevy_ecs_ldtk = "0.15.0"
bevy_render = "0.19.0"
leafwing-input-manager = "0.21.0"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = "0.28.0"
strum_macros = "0.28.0"

[dependencies]
bevy-inspector-egui = { version = "0.37", optional = true }
bevy.workspace = true
bevy_common_assets.workspace = true
bevy_ecs_ldtk.workspace = true
bevy_render.workspace = true
leafwing-input-manager.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
strum_macros.workspace = true



# Dev only: 'cargo run --features dev' turns on dynamic linking
[features]
dev = ["bevy/dynamic_linking", "dep:bevy-inspector-egui"]
# dev = ["dep:bevy-inspector-egui"]

# light optimization, fast recompiles
[profile.dev]
opt-level = 1

# dependencies: full optimisation, compile once
[profile.dev.package."*"]
opt-level = 3
