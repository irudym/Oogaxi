[package]
name = "oogaxi"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.0"
bevy-inspector-egui = { version = "0.37", optional = true }
bevy_common_assets = { version = "0.17", features = ["json"] }
bevy_ecs_ldtk = "0.15.0"
leafwing-input-manager = "0.21.0"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"



# Dev only: 'cargo run --features dev' turns on dynamic linking
[features]
# dev = ["bevy/dynamic_linking", "dep:bevy-inspector-egui"]
dev = ["dep:bevy-inspector-egui"]

# light optimization, fast recompiles
[profile.dev]
opt-level = 1

# dependencies: full optimisation, compile once
[profile.dev.package."*"]
opt-level = 3
